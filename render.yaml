# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This describes the service; it does not deploy it. Create the Blueprint in
# Render's dashboard, set the secret env vars, and deploy — see the
# "Deploying" section of README.md.
#
# The run store is a Turso (libSQL) database, on Turso's free tier — Render's
# free plan has no persistent disk (D-017). No env var VALUE is in this file;
# everything is set in the dashboard.

services:
  - type: web
    name: tribunal
    runtime: node
    plan: free
    branch: main
    numInstances: 1        # one Turso database + the in-process "one run at a time" lock assume a single instance
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: OPENROUTER_API_KEY   # secret — set in the dashboard
        sync: false
      - key: RUN_BUDGET_USD       # per-run USD cap — set in the dashboard
        sync: false
      - key: DEMO_MODEL_ID        # optional: a cheap paid model so Mode A works (D-012)
        sync: false
      - key: TURSO_DATABASE_URL   # libsql://<db>.turso.io — from `turso db show --url`
        sync: false
      - key: TURSO_AUTH_TOKEN     # from `turso db tokens create`
        sync: false
