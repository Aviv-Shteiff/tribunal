<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tribunal</title>
<style>
  /* Keep [hidden] authoritative: an id rule like `#spinner { display: flex }`
     otherwise out-specifies the UA `[hidden] { display: none }` and the
     element shows on load despite the attribute. */
  [hidden] { display: none !important; }

  body { font: 15px/1.55 system-ui, sans-serif; max-width: 820px; margin: 2rem auto;
         padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  h2 { font-size: 1.1rem; margin-top: 1.8rem; border-bottom: 1px solid #ddd; padding-bottom: .2rem; }
  p.lede { color: #555; margin-top: 0; }

  /* --- form --- */
  #form { transition: opacity .15s ease, filter .15s ease; }
  #form.dimmed { opacity: .4; filter: blur(1.5px); pointer-events: none; }
  label { display: inline-block; }
  textarea { width: 100%; min-height: 12rem; font: 13px/1.45 ui-monospace, Menlo, monospace;
             padding: .5rem; box-sizing: border-box; }
  fieldset { border: 1px solid #ccc; margin: 1rem 0; padding: .6rem .8rem; }
  fieldset label { display: block; margin: .2rem 0; }
  button { font-size: 1rem; padding: .5rem 1.3rem; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: progress; }

  /* --- waiting state --- */
  #spinner { display: flex; align-items: center; gap: .6rem; margin: 1.2rem 0;
             font-weight: bold; color: #7a4a00; }
  .spinner { width: 1.15rem; height: 1.15rem; flex: none; border-radius: 50%;
             border: 3px solid #e0cdb0; border-top-color: #7a4a00;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  /* --- messages --- */
  .error { border-left: 4px solid #b00020; background: #fff2f2; padding: .6rem .9rem;
           white-space: pre-wrap; margin: 1rem 0; }
  .note { color: #555; margin: .6rem 0; }

  /* --- verdict + speech cards --- */
  .card { border: 1px solid #ddd; border-radius: 4px; padding: .7rem .9rem; margin: .7rem 0; }
  .card.speech { border-color: #e6e6e6; }
  .chead { display: flex; align-items: baseline; gap: .55rem; font-weight: bold; }
  .card .chead { font-size: 1.05rem; }
  .card.speech .chead { font-size: .98rem; }
  .pill { font-size: .72rem; font-weight: bold; letter-spacing: .04em; text-transform: uppercase;
          padding: .12rem .5rem; border-radius: 999px; }
  .pill.justified { background: #e2f3e2; color: #1c5b1c; }
  .pill.not-justified { background: #f7dede; color: #8a1c1c; }
  details { margin-top: .5rem; }
  summary { cursor: pointer; color: #33528a; font-size: .9rem; user-select: none; }

  /* --- rendered markdown --- */
  .md { margin-top: .55rem; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: .55rem 0; }
  .md h4 { margin: .8rem 0 .3rem; font-size: 1rem; }
  .md ol { margin: .5rem 0; padding-left: 1.5rem; }
  .md li { margin: .3rem 0; }

  /* --- representatives table --- */
  table { border-collapse: collapse; margin-top: .5rem; }
  th, td { border: 1px solid #ddd; padding: .35rem .8rem; text-align: left; }
  th { background: #f6f6f6; font-size: .9rem; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 3px; font-size: .85rem; }
  .badge.ok { background: #e2f3e2; }
  .badge.failed { background: #f7dede; }
  .badge.na { background: #ececec; }

  /* --- run summary --- */
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .9rem; margin: .5rem 0 0; }
  dt { font-weight: bold; }
  dd { margin: 0; }
  #tech { margin-top: .8rem; }
  #tech dl { margin-top: .5rem; }
</style>
</head>
<body>
<h1>The Tribunal</h1>
<p class="lede">One charge sheet, seven agents, one real run. Model calls are live
and a run takes a minute or two.</p>

<div id="form">
  <label for="case"><strong>Charge sheet</strong> (editable)</label>
  <textarea id="case">{{CHARGE_SHEET}}</textarea>

  <fieldset>
    <legend>Model configuration</legend>
    <label><input type="radio" name="mode" value="a" checked>
      <strong>Mode A</strong> — one model for all seven agents</label>
    <label><input type="radio" name="mode" value="b">
      <strong>Mode B</strong> — one model per agent (skips the free tier)</label>
  </fieldset>

  <button id="run">Run the tribunal</button>
</div>

<div id="spinner" hidden>
  <span class="spinner" aria-hidden="true"></span>
  <span>Running — real model calls, this takes 1–2 minutes. Do not close this tab.</span>
</div>

<div id="error" class="error" hidden></div>

<div id="results" hidden>
  <h2>Verdicts</h2>
  <p id="verdict-note" class="note" hidden></p>
  <div id="verdicts"></div>

  <h2>Representatives</h2>
  <table id="reps">
    <thead><tr><th>Agent</th><th>Seat</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="speeches"></div>

  <h2>Run summary</h2>
  <dl id="summary-basic"></dl>
  <details id="tech">
    <summary>Technical details</summary>
    <dl id="summary-tech"></dl>
  </details>
</div>

<script>
const $ = (id) => document.getElementById(id);
const btn = $('run');
let inFlight = false;

btn.addEventListener('click', async () => {
  if (inFlight) return;
  inFlight = true;
  btn.disabled = true;
  $('error').hidden = true;
  $('results').hidden = true;
  $('form').classList.add('dimmed');
  $('spinner').hidden = false;

  const mode = document.querySelector('input[name="mode"]:checked').value;
  const caseText = $('case').value;

  try {
    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ caseText, mode }),
    });
    let data = null;
    try { data = await resp.json(); } catch { /* fall through to status check */ }

    if (!resp.ok || !data || !data.ok) {
      showError((data && data.error) || ('HTTP ' + resp.status + ' ' + resp.statusText));
    } else {
      showResults(data);
    }
  } catch (err) {
    showError('Request failed: ' + err.message);
  } finally {
    inFlight = false;
    btn.disabled = false;
    $('form').classList.remove('dimmed');
    $('spinner').hidden = true;
  }
});

function showError(msg) {
  $('error').hidden = false;
  $('error').textContent = msg;
}

// --- minimal markdown: the subset turn-5 runs actually produced ---
// bold **x**, italic *x*, ATX headers, blank-line paragraphs (real or the
// literal two-char "\n" some models emit), and tight numbered lists.
function renderMarkdown(src) {
  const escHtml = (s) =>
    s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const inline = (s) =>
    escHtml(s)
      .replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');

  const text = String(src == null ? '' : src).replace(/\\r\\n|\\n|\r\n|\r/g, '\n');
  const blocks = text.split(/\n{2,}/).map((b) => b.trim()).filter(Boolean);

  return blocks
    .map((block) => {
      const lines = block.split('\n');
      if (lines.length === 1 && /^#{1,6}\s+\S/.test(lines[0])) {
        return '<h4>' + inline(lines[0].replace(/^#{1,6}\s+/, '')) + '</h4>';
      }
      if (lines.length > 1 && lines.every((l) => /^\s*\d+[.)]\s+\S/.test(l))) {
        return (
          '<ol>' +
          lines.map((l) => '<li>' + inline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') +
          '</ol>'
        );
      }
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    })
    .join('');
}

function makeCard({ title, verdict, body, toggle, extraClass }) {
  const card = document.createElement('div');
  card.className = 'card' + (extraClass ? ' ' + extraClass : '');

  const head = document.createElement('div');
  head.className = 'chead';
  const name = document.createElement('span');
  name.textContent = title;
  head.appendChild(name);
  if (verdict) {
    const pill = document.createElement('span');
    pill.className = 'pill ' + (verdict === 'justified' ? 'justified' : 'not-justified');
    pill.textContent = verdict;
    head.appendChild(pill);
  }
  card.appendChild(head);

  const det = document.createElement('details');
  const sum = document.createElement('summary');
  sum.textContent = toggle;
  det.appendChild(sum);
  const md = document.createElement('div');
  md.className = 'md';
  md.innerHTML = renderMarkdown(body); // body is escaped inside renderMarkdown
  det.appendChild(md);
  card.appendChild(det);

  return card;
}

function fillDl(dl, rows) {
  dl.replaceChildren();
  for (const [k, v] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = String(v);
    dl.append(dt, dd);
  }
}

function showResults(d) {
  $('results').hidden = false;

  // --- verdict-count note when fewer than three judges returned ---
  const note = $('verdict-note');
  if (d.verdicts.length < 3) {
    const failed = d.judges.failed;
    note.textContent =
      d.verdicts.length + ' of 3 judges returned a verdict — ' +
      failed.length + ' failed, ' + d.judges.notAttempted.length + ' not attempted' +
      (failed.length ? ' (' + failed.join(', ') + ')' : '') + '.';
    note.hidden = false;
  } else {
    note.hidden = true;
    note.textContent = '';
  }

  // --- verdicts: id + verdict shown; reasoning behind a per-card toggle ---
  const vc = $('verdicts');
  vc.replaceChildren();
  if (d.verdicts.length === 0) {
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = 'No judge produced a valid verdict.';
    vc.appendChild(p);
  }
  for (const v of d.verdicts) {
    vc.appendChild(makeCard({
      title: v.judge_id,
      verdict: v.verdict,
      body: v.reasoning,
      toggle: 'Show full reasoning',
    }));
  }

  // --- representative status table (compact; how a partial run stays visible) ---
  const tb = $('reps').querySelector('tbody');
  tb.replaceChildren();
  for (const rep of d.representatives) {
    const cls = rep.status === 'ok' ? 'ok' : rep.status === 'failed' ? 'failed' : 'na';
    const tr = document.createElement('tr');
    for (const text of [rep.agentId, rep.seat]) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    }
    const td = document.createElement('td');
    const span = document.createElement('span');
    span.className = 'badge ' + cls;
    span.textContent = rep.status;
    td.appendChild(span);
    tr.appendChild(td);
    tb.appendChild(tr);
  }

  // --- speeches: one collapsed card per representative that produced one ---
  const sc = $('speeches');
  sc.replaceChildren();
  for (const rep of d.representatives) {
    if (typeof rep.speech === 'string' && rep.speech.trim() !== '') {
      sc.appendChild(makeCard({
        title: rep.agentId + ' (' + rep.seat + ')',
        body: rep.speech,
        toggle: 'Show speech',
        extraClass: 'speech',
      }));
    }
  }

  // --- run summary, tier 1: what a first-time viewer needs ---
  fillDl($('summary-basic'), [
    ['Mode', d.mode],
    ['Verdicts returned', d.verdicts.length + ' of 3'],
    ['Total cost', '$' + d.totals.costUsd.toFixed(6)],
    ['Run', d.stopped
      ? 'Stopped by the budget gate — ' + (d.stopReason || 'reason not recorded')
      : 'Completed'],
  ]);

  // --- run summary, tier 2: what a developer checking the record needs ---
  const t = d.totals;
  const tech = [
    ['Model source', d.modelSource],
    ['Calls', t.calls],
    ['Prompt tokens', t.promptTokens],
    ['Completion tokens', t.completionTokens],
    ['Total tokens', t.totalTokens],
  ];
  if (t.callsWithUnknownCost) tech.push(['Calls with no reported cost', t.callsWithUnknownCost]);
  tech.push(['Recorded call duration', t.durationMs + ' ms']);
  tech.push(['Wall-clock duration', d.wallClockMs + ' ms']);
  if (d.runFile) tech.push(['Saved to', 'runs/' + d.runFile]);
  fillDl($('summary-tech'), tech);
  $('tech').open = false;
}
</script>
</body>
</html>
