<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tribunal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>The Tribunal</h1>
<p class="lede">One charge sheet, seven agents, one real run. Model calls are live
and a run takes a minute or two.</p>
<p class="nav"><a href="/past">Past runs &rarr;</a></p>

<div id="form">
  <label for="case"><strong>Charge sheet</strong> (editable)</label>
  <textarea id="case">{{CHARGE_SHEET}}</textarea>

  <fieldset>
    <legend>Model configuration</legend>
    <label><input type="radio" name="mode" value="a" checked>
      <strong>Mode A</strong> — one model for all seven agents</label>
    <label><input type="radio" name="mode" value="b">
      <strong>Mode B</strong> — one model per agent (skips the free tier)</label>
  </fieldset>

  <button id="run">Run the tribunal</button>
</div>

<div id="spinner" hidden>
  <span class="spinner" aria-hidden="true"></span>
  <span>Running — real model calls, this takes 1–2 minutes. Do not close this tab.</span>
</div>

<div id="error" class="error" hidden></div>

<div id="results" hidden>
  <h2>Verdicts</h2>
  <p id="verdict-note" class="note" hidden></p>
  <div id="verdicts"></div>

  <h2>Representatives</h2>
  <table id="reps">
    <thead><tr><th>Agent</th><th>Seat</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="speeches"></div>

  <h2>Run summary</h2>
  <dl id="summary-basic"></dl>
  <details id="tech">
    <summary>Technical details</summary>
    <dl id="summary-tech"></dl>
  </details>
</div>

<script src="/render.js"></script>
<script>
const btn = $('run');
let inFlight = false;

btn.addEventListener('click', async () => {
  if (inFlight) return;
  inFlight = true;
  btn.disabled = true;
  $('error').hidden = true;
  $('results').hidden = true;
  $('form').classList.add('dimmed');
  $('spinner').hidden = false;

  const mode = document.querySelector('input[name="mode"]:checked').value;
  const caseText = $('case').value;

  try {
    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ caseText, mode }),
    });
    let data = null;
    try { data = await resp.json(); } catch { /* fall through to status check */ }

    if (!resp.ok || !data || !data.ok) {
      showError((data && data.error) || ('HTTP ' + resp.status + ' ' + resp.statusText));
    } else {
      showResults(data);
    }
  } catch (err) {
    showError('Request failed: ' + err.message);
  } finally {
    inFlight = false;
    btn.disabled = false;
    $('form').classList.remove('dimmed');
    $('spinner').hidden = true;
  }
});
</script>
</body>
</html>
