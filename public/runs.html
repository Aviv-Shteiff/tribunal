<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case docket — The Tribunal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="sheet flow">

  <header>
    <p class="wordmark">The Tribunal</p>
    <p class="tagline">Case docket — every filed case and its opinions, newest first. Read-only.</p>
    <p class="nav"><a href="/">&larr; File a case</a></p>
  </header>

  <div id="error" class="error" hidden></div>

  <section class="stack">
    <h2>Case docket</h2>
    <div class="table-wrap">
      <table id="runlist">
        <thead><tr>
          <th class="col-when">Filed</th>
          <th class="col-mode">Mode</th>
          <th class="col-verdicts">Opinions</th>
          <th class="col-cost">Cost</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="empty" class="note" hidden>No cases filed yet.</p>
  </section>

  <div id="detail" hidden>
    <div id="results" hidden>
      <div id="docket"></div>

      <section class="stack">
        <h2>Verdicts</h2>
        <p id="verdict-note" class="note" hidden></p>
        <div id="verdicts"></div>
      </section>

      <section class="stack">
        <h2>Representatives</h2>
        <table id="reps">
          <thead><tr><th>Agent</th><th>Seat</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="speeches"></div>
      </section>

      <section class="stack">
        <h2>Run summary</h2>
        <dl id="summary-basic"></dl>
        <details id="tech">
          <summary>Technical details</summary>
          <dl id="summary-tech"></dl>
        </details>
      </section>
    </div>
  </div>

</main>

<script src="/render.js"></script>
<script>
const tbody = $('runlist').querySelector('tbody');

function fmtWhen(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? iso : d.toLocaleString();
}

async function loadList() {
  try {
    const resp = await fetch('/runs');
    const data = await resp.json();
    if (!resp.ok || !data.ok) return showError(data.error || ('HTTP ' + resp.status));

    tbody.replaceChildren();
    if (data.runs.length === 0) {
      $('empty').hidden = false;
      return;
    }
    for (const run of data.runs) {
      const tr = document.createElement('tr');
      tr.dataset.id = run.id;

      const when = document.createElement('td');
      when.className = 'col-when';
      const a = document.createElement('a');
      a.href = '#run-' + run.id;
      a.textContent = fmtWhen(run.started_at);
      when.appendChild(a);

      const mode = document.createElement('td');
      mode.className = 'col-mode';
      mode.textContent = run.mode;

      const verdicts = document.createElement('td');
      verdicts.className = 'col-verdicts';
      verdicts.textContent = run.verdict_summary +
        (run.stopped ? ' — stopped by the budget gate' : '');

      const cost = document.createElement('td');
      cost.className = 'col-cost';
      cost.textContent = '$' + run.total_cost.toFixed(6);

      tr.append(when, mode, verdicts, cost);
      tr.addEventListener('click', () => openRun(run.id));
      tbody.appendChild(tr);
    }
  } catch (err) {
    showError('Could not load the docket: ' + err.message);
  }
}

async function openRun(id) {
  for (const tr of tbody.querySelectorAll('tr')) {
    tr.classList.toggle('selected', tr.dataset.id === String(id));
  }
  try {
    const resp = await fetch('/runs/' + id);
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      showError(data.error || ('HTTP ' + resp.status));
      return;
    }
    $('detail').hidden = false;
    showResults(data);
    const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('detail').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  } catch (err) {
    showError('Could not load that case: ' + err.message);
  }
}

// deep link: /past#run-42 opens run 42 once the list is in
window.addEventListener('load', async () => {
  await loadList();
  const m = /^#run-(\d+)$/.exec(location.hash);
  if (m) openRun(Number(m[1]));
});
</script>
</body>
</html>
